name: rammah-production

x-api: &api
  build:
    context: ..
    dockerfile: rammah-api/Dockerfile
  image: rammah-api:local
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped

services:
  migrate:
    <<: *api
    restart: "no"
    command: npm run db:migrate --workspace=rammah-api

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: npm run start:worker --workspace=rammah-api

  web:
    build:
      context: ..
      dockerfile: rammah-next/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    image: rammah-web:local
    env_file: ${ENV_FILE:-.env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
