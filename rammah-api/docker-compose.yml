services:
  postgres:
    image: postgres:16-alpine
    container_name: rammah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rammah
    ports:
      - "55432:5432"
    volumes:
      - rammah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rammah"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rammah_postgres_data:
